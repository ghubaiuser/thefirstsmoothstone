<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">A Manipular heti ciklusa</title>
  <desc id="desc">Öt építkező nap után közös csata következik, majd a hetet verifikált, de nem pontozott sabbat zárja.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#b76933"/></marker></defs>
  <rect width="1440" height="720" fill="#f4efe4"/>
  <text x="720" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#142726">EGY HÉT: ÉPÍTKEZÉS, CSATA, SABBAT</text>
  <path d="M172 330 H1268" stroke="#b76933" stroke-width="7" marker-end="url(#a)"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(110 220)"><circle cx="70" cy="110" r="70" fill="#e8f2f0" stroke="#176b68" stroke-width="4"/><text x="70" y="98" text-anchor="middle" font-size="27" font-weight="700" fill="#142726">1</text><text x="70" y="128" text-anchor="middle" font-size="17" fill="#526866">kihívás</text></g>
    <g transform="translate(290 220)"><circle cx="70" cy="110" r="70" fill="#e8f2f0" stroke="#176b68" stroke-width="4"/><text x="70" y="98" text-anchor="middle" font-size="27" font-weight="700" fill="#142726">2</text><text x="70" y="128" text-anchor="middle" font-size="17" fill="#526866">kihívás</text></g>
    <g transform="translate(470 220)"><circle cx="70" cy="110" r="70" fill="#e8f2f0" stroke="#176b68" stroke-width="4"/><text x="70" y="98" text-anchor="middle" font-size="27" font-weight="700" fill="#142726">3</text><text x="70" y="128" text-anchor="middle" font-size="17" fill="#526866">kihívás</text></g>
    <g transform="translate(650 220)"><circle cx="70" cy="110" r="70" fill="#e8f2f0" stroke="#176b68" stroke-width="4"/><text x="70" y="98" text-anchor="middle" font-size="27" font-weight="700" fill="#142726">4</text><text x="70" y="128" text-anchor="middle" font-size="17" fill="#526866">kihívás</text></g>
    <g transform="translate(830 220)"><circle cx="70" cy="110" r="70" fill="#e8f2f0" stroke="#176b68" stroke-width="4"/><text x="70" y="98" text-anchor="middle" font-size="27" font-weight="700" fill="#142726">5</text><text x="70" y="128" text-anchor="middle" font-size="17" fill="#526866">kihívás</text></g>
    <g transform="translate(1010 205)"><circle cx="78" cy="125" r="84" fill="#d7b285" stroke="#8a4f2f" stroke-width="5"/><text x="78" y="115" text-anchor="middle" font-size="27" font-weight="700" fill="#142726">6</text><text x="78" y="148" text-anchor="middle" font-size="19" font-weight="700" fill="#142726">CSATA</text></g>
    <g transform="translate(1210 205)"><circle cx="78" cy="125" r="84" fill="#152927" stroke="#176b68" stroke-width="5"/><text x="78" y="112" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">7</text><text x="78" y="146" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">SABBAT</text></g>
  </g>
  <text x="540" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#176b68">egyéni és többnapos építkezés</text>
  <text x="1080" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#8a4f2f">közös következmény</text>
  <text x="1292" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#142726">verifikált, nem pontozott</text>
  <rect x="170" y="570" width="1100" height="72" rx="18" fill="#ffffff" stroke="#d6ccbc" stroke-width="3"/>
  <text x="720" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#526866">A hét kezdőnapja, a csataablak és a pihenőnap kohorszonként konfigurálható.</text>
</svg>
