<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">A semleges motor és a cserélhető programcsomag</title>
  <desc id="desc">A semleges alkalmazásmotor betölti a programcsomagot. A jellemvonásrendszer és a kihíváskönyvtár piros kerettel kidolgozandó. Az első kimenet a biblikus Manipular kampány.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b76933"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f2524" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1440" height="800" fill="#f4efe4"/>
  <text x="720" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#142726">MOTOR ÉS ÜZEMANYAG SZÉTVÁLASZTÁSA</text>
  <rect x="70" y="180" width="360" height="430" rx="24" fill="#ffffff" stroke="#176b68" stroke-width="4" filter="url(#shadow)"/>
  <text x="250" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#142726">SEMLEGES MOTOR</text>
  <text x="110" y="300" font-family="Arial, sans-serif" font-size="21" fill="#465d5b">• szerepkörök és jogok</text>
  <text x="110" y="346" font-family="Arial, sans-serif" font-size="21" fill="#465d5b">• programidő és események</text>
  <text x="110" y="392" font-family="Arial, sans-serif" font-size="21" fill="#465d5b">• kiosztás és verifikáció</text>
  <text x="110" y="438" font-family="Arial, sans-serif" font-size="21" fill="#465d5b">• erőforrás és csata</text>
  <text x="110" y="484" font-family="Arial, sans-serif" font-size="21" fill="#465d5b">• profil és jelentés</text>
  <text x="110" y="530" font-family="Arial, sans-serif" font-size="21" fill="#465d5b">• adatvédelem és audit</text>
  <line x1="440" y1="395" x2="520" y2="395" stroke="#b76933" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="540" y="130" width="500" height="540" rx="24" fill="#e8f2f0" stroke="#176b68" stroke-width="4" filter="url(#shadow)"/>
  <text x="790" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#142726">CSERÉLHETŐ PROGRAMCSOMAG</text>
  <rect x="590" y="230" width="400" height="86" rx="14" fill="#fff8f8" stroke="#c93737" stroke-width="5"/>
  <text x="790" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9b2222">🟥 KIDOLGOZANDÓ 1</text>
  <text x="790" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4b2525">jellemvonások, interjúk, mérés</text>
  <rect x="590" y="338" width="400" height="86" rx="14" fill="#fff8f8" stroke="#c93737" stroke-width="5"/>
  <text x="790" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9b2222">🟥 KIDOLGOZANDÓ 2</text>
  <text x="790" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4b2525">kihívások, csaták, forgatókönyv</text>
  <rect x="590" y="446" width="190" height="78" rx="14" fill="#ffffff" stroke="#6f8583" stroke-width="3"/>
  <text x="685" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#142726">JELENTÉS</text>
  <text x="685" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#526866">sablon és hang</text>
  <rect x="800" y="446" width="190" height="78" rx="14" fill="#ffffff" stroke="#6f8583" stroke-width="3"/>
  <text x="895" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#142726">TÉMA</text>
  <text x="895" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#526866">grafika és történet</text>
  <rect x="590" y="544" width="400" height="78" rx="14" fill="#ffffff" stroke="#6f8583" stroke-width="3"/>
  <text x="790" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#142726">ERŐFORRÁSOK ÉS SZABÁLYOK</text>
  <text x="790" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#526866">verziózott, validált konfiguráció</text>
  <line x1="1050" y1="395" x2="1120" y2="395" stroke="#b76933" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="1140" y="205" width="240" height="380" rx="24" fill="#152927" stroke="#b76933" stroke-width="4" filter="url(#shadow)"/>
  <text x="1260" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">MANIPULAR</text>
  <path d="M1192 360 H1328 L1304 510 H1216 Z" fill="#d8cbb4" stroke="#ffffff" stroke-width="4"/>
  <path d="M1218 382 H1302 M1214 422 H1308 M1212 462 H1310" stroke="#8a4f2f" stroke-width="8"/>
  <path d="M1260 330 V525" stroke="#ffffff" stroke-width="5"/>
  <text x="1260" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#e3d9c6">biblikus jellemfejlesztő</text>
  <text x="720" y="745" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#526866">Az első kampány keresztény. A motor később más tartalommal is működik.</text>
</svg>
